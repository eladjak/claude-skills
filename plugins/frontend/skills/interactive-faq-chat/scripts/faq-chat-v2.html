<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FAQ Chat v2 — AI Agent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-primary: #0a0a0f;
      --bg-secondary: #111118;
      --bg-card: #1a1a2e;
      --bg-bubble-bot: #1c1c32;
      --bg-bubble-user: #6c3ce0;
      --bg-input: #16161f;
      --text-primary: #e8e8f0;
      --text-secondary: #9898b0;
      --text-muted: #5e5e78;
      --accent: #8b5cf6;
      --accent-secondary: #a855f7;
      --accent-glow: rgba(139, 92, 246, 0.25);
      --accent-subtle: rgba(139, 92, 246, 0.1);
      --border: rgba(255, 255, 255, 0.06);
      --border-accent: rgba(139, 92, 246, 0.3);
      --online-green: #22c55e;
      --whatsapp-green: #25D366;
      --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.5);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 20px;
      --radius-full: 9999px;
      --glass-bg: rgba(17, 17, 24, 0.85);
      --glass-border: rgba(255, 255, 255, 0.08);
    }

    body {
      font-family: 'Heebo', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      direction: rtl;
    }

    /* ─── Chat Container (Glass) ─── */
    .chat-container {
      width: 100%;
      max-width: 560px;
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: var(--radius-xl);
      border: 1px solid var(--glass-border);
      overflow: hidden;
      box-shadow:
        var(--shadow-lg),
        0 0 80px rgba(139, 92, 246, 0.06),
        inset 0 1px 0 rgba(255, 255, 255, 0.04);
      display: flex;
      flex-direction: column;
      height: 720px;
      position: relative;
    }

    /* ─── Header ─── */
    .chat-header {
      padding: 18px 22px;
      background: linear-gradient(135deg, rgba(26, 26, 46, 0.9) 0%, rgba(139, 92, 246, 0.08) 100%);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
    }

    .avatar {
      width: 48px;
      height: 48px;
      border-radius: var(--radius-full);
      background: linear-gradient(135deg, var(--accent), var(--accent-secondary));
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 22px;
      color: white;
      position: relative;
      flex-shrink: 0;
      box-shadow: 0 0 24px var(--accent-glow);
    }

    .avatar-image {
      width: 100%;
      height: 100%;
      border-radius: var(--radius-full);
      object-fit: cover;
    }

    .online-dot {
      position: absolute;
      bottom: 1px;
      left: 1px;
      width: 13px;
      height: 13px;
      background: var(--online-green);
      border-radius: var(--radius-full);
      border: 2.5px solid var(--bg-secondary);
      animation: pulse-online 2s ease-in-out infinite;
    }

    @keyframes pulse-online {
      0%, 100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.4); }
      50% { box-shadow: 0 0 0 5px rgba(34, 197, 94, 0); }
    }

    .header-info { flex: 1; min-width: 0; }

    .header-name {
      font-size: 17px;
      font-weight: 600;
      color: var(--text-primary);
      line-height: 1.3;
    }

    .header-status {
      font-size: 13px;
      color: var(--online-green);
      display: flex;
      align-items: center;
      gap: 5px;
      margin-top: 2px;
    }

    .header-status::before {
      content: '';
      width: 6px;
      height: 6px;
      background: var(--online-green);
      border-radius: var(--radius-full);
      display: inline-block;
    }

    /* ─── Messages Area ─── */
    .messages-area {
      flex: 1;
      overflow-y: auto;
      padding: 20px 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      scroll-behavior: smooth;
    }

    .messages-area::-webkit-scrollbar { width: 5px; }
    .messages-area::-webkit-scrollbar-track { background: transparent; }
    .messages-area::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 10px;
    }

    /* ─── Welcome ─── */
    .welcome-message {
      text-align: center;
      padding: 16px 0 8px;
    }

    .welcome-emoji {
      font-size: 36px;
      margin-bottom: 8px;
      display: block;
    }

    .welcome-text {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.6;
    }

    /* ─── Message Rows ─── */
    .message-row {
      display: flex;
      gap: 10px;
      max-width: 88%;
      animation: fadeSlideIn 0.3s ease-out;
    }

    .message-row.bot { align-self: flex-start; }

    .message-row.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .message-avatar {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-full);
      background: linear-gradient(135deg, var(--accent), var(--accent-secondary));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
      color: white;
      flex-shrink: 0;
      margin-top: 4px;
    }

    .message-avatar img {
      width: 100%;
      height: 100%;
      border-radius: var(--radius-full);
      object-fit: cover;
    }

    .message-avatar.user-avatar {
      background: linear-gradient(135deg, #6c3ce0, #8b5cf6);
    }

    .message-bubble {
      padding: 12px 16px;
      border-radius: var(--radius-lg);
      font-size: 14.5px;
      line-height: 1.65;
      position: relative;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }

    .message-row.bot .message-bubble {
      background: var(--bg-bubble-bot);
      color: var(--text-primary);
      border-bottom-left-radius: 4px;
    }

    .message-row.user .message-bubble {
      background: var(--bg-bubble-user);
      color: white;
      border-bottom-right-radius: 4px;
    }

    .message-time {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 5px;
      text-align: start;
    }

    .message-row.user .message-time {
      text-align: end;
      color: rgba(255, 255, 255, 0.45);
    }

    /* ─── WhatsApp Fallback Button ─── */
    .wa-fallback-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      padding: 10px 18px;
      background: var(--whatsapp-green);
      color: white;
      border: none;
      border-radius: var(--radius-full);
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 2px 12px rgba(37, 211, 102, 0.3);
    }

    .wa-fallback-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 18px rgba(37, 211, 102, 0.4);
    }

    .wa-fallback-btn:active { transform: translateY(0); }

    .wa-fallback-btn svg {
      width: 18px;
      height: 18px;
      fill: white;
    }

    /* ─── Typing Indicator ─── */
    .typing-indicator {
      display: flex;
      gap: 10px;
      align-self: flex-start;
      max-width: 88%;
      animation: fadeSlideIn 0.3s ease-out;
    }

    .typing-bubble {
      background: var(--bg-bubble-bot);
      padding: 14px 20px;
      border-radius: var(--radius-lg);
      border-bottom-left-radius: 4px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .typing-dot {
      width: 7px;
      height: 7px;
      background: var(--text-secondary);
      border-radius: var(--radius-full);
      animation: typingBounce 1.2s ease-in-out infinite;
    }

    .typing-dot:nth-child(2) { animation-delay: 0.15s; }
    .typing-dot:nth-child(3) { animation-delay: 0.3s; }

    @keyframes typingBounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-6px); opacity: 1; }
    }

    /* ─── Suggestion Chips ─── */
    .suggestions-strip {
      padding: 10px 18px 6px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 8px;
      overflow-x: auto;
      flex-shrink: 0;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .suggestions-strip::-webkit-scrollbar { display: none; }

    .suggestion-chip {
      flex-shrink: 0;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-full);
      padding: 8px 16px;
      color: var(--text-primary);
      font-family: inherit;
      font-size: 12.5px;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .suggestion-chip:hover {
      background: var(--accent-subtle);
      border-color: var(--border-accent);
      transform: translateY(-1px);
    }

    .suggestion-chip:active { transform: translateY(0); }

    .suggestion-chip:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      transform: none;
    }

    .suggestion-chip .chip-icon { font-size: 13px; }

    /* ─── Input Area ─── */
    .input-area {
      padding: 10px 16px 16px;
      border-top: 1px solid var(--border);
      background: linear-gradient(0deg, rgba(10, 10, 15, 0.6) 0%, transparent 100%);
      display: flex;
      gap: 10px;
      align-items: flex-end;
      flex-shrink: 0;
    }

    .input-wrapper {
      flex: 1;
      position: relative;
    }

    .chat-input {
      width: 100%;
      padding: 12px 16px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      direction: rtl;
      resize: none;
      line-height: 1.5;
      min-height: 44px;
      max-height: 100px;
    }

    .chat-input::placeholder {
      color: var(--text-muted);
    }

    .chat-input:focus {
      border-color: var(--border-accent);
      box-shadow: 0 0 0 3px var(--accent-subtle), 0 0 20px rgba(139, 92, 246, 0.08);
    }

    .send-btn {
      width: 44px;
      height: 44px;
      border-radius: var(--radius-md);
      border: none;
      background: linear-gradient(135deg, var(--accent), var(--accent-secondary));
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
      flex-shrink: 0;
      box-shadow: 0 2px 12px var(--accent-glow);
    }

    .send-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 20px var(--accent-glow);
    }

    .send-btn:active { transform: translateY(0); }

    .send-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }

    .send-btn svg {
      width: 20px;
      height: 20px;
      fill: white;
      /* RTL: flip the send arrow */
      transform: scaleX(-1);
    }

    /* ─── Animations ─── */
    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ─── Responsive ─── */
    @media (max-width: 600px) {
      body {
        padding: 0;
        align-items: stretch;
      }

      .chat-container {
        max-width: none;
        border-radius: 0;
        height: 100vh;
        height: 100dvh;
      }

      .messages-area { padding: 16px 14px; }

      .suggestions-strip { padding: 8px 14px 4px; }

      .input-area { padding: 8px 12px 12px; }

      .message-row { max-width: 92%; }
    }

    /* ─── Embed Mode ─── */
    .chat-container.embed-mode {
      height: auto;
      min-height: 500px;
      max-height: 750px;
    }
  </style>
</head>
<body>
  <div class="chat-container" id="chatContainer">
    <!-- Header -->
    <div class="chat-header">
      <div class="avatar" id="headerAvatar">
        <span id="avatarContent"></span>
        <div class="online-dot"></div>
      </div>
      <div class="header-info">
        <div class="header-name" id="headerName"></div>
        <div class="header-status" id="headerStatus"></div>
      </div>
    </div>

    <!-- Messages -->
    <div class="messages-area" id="messagesArea">
      <div class="welcome-message">
        <span class="welcome-emoji" id="welcomeEmoji"></span>
        <p class="welcome-text" id="welcomeText"></p>
      </div>
    </div>

    <!-- Suggestion Chips -->
    <div class="suggestions-strip" id="suggestionsStrip"></div>

    <!-- Input -->
    <div class="input-area">
      <div class="input-wrapper">
        <textarea class="chat-input" id="chatInput" rows="1" placeholder="כתבו שאלה..."></textarea>
      </div>
      <button class="send-btn" id="sendBtn" disabled aria-label="שלח">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
  </div>

  <script>

    // ═══════════════════════════════════════════════════════════

        },
        {
          q: ['זמינות', 'פנוי', 'available', 'מתי פנוי', 'עומס'],

        {
          q: ['ai', 'בינה מלאכותית', 'צאטבוט', 'chatbot', 'אוטומציה', 'automation', 'חכם'],
          a: 'יש לי ניסיון עמוק ב-AI ואוטומציה:\n\n🧠 סוכני AI אוטונומיים (Claude, GPT, Gemini)\n🧠 צ\'אטבוטים חכמים לאתרים ו-WhatsApp\n🧠 אוטומציית תהליכים עסקיים\n🧠 אינטגרציית יצירת תמונות ווידאו\n🧠 מערכות Multi-Agent\n\nAI הוא הכלי החזק ביותר היום — ואני יודע לרתום אותו לעסק שלך.'
        },
        {
          q: ['תחזוקה', 'תמיכה', 'אחרי', 'support', 'באגים', 'עדכונים'],
          a: 'אני מציע תחזוקה ותמיכה שוטפת:\n\n🔧 חבילות תחזוקה חודשיות\n🔧 עדכוני אבטחה שוטפים\n🔧 גיבויים אוטומטיים\n🔧 ניטור ביצועים\n🔧 תיקוני באגים\n🔧 שדרוגים ושיפורים\n\nגם אחרי סיום הפרויקט, אני זמין לתמיכה מלאה.'
        },
        {
          q: ['remote', 'ריחוק', 'מרחוק', 'אונסייט', 'onsite', 'היכן', 'איפה', 'מיקום'],
          a: 'אני עובד בשני המודלים:\n\n🏠 Remote — רוב הפרויקטים מתנהלים מרחוק בצורה חלקה\n🏢 On-site — אפשרי לפגישות, סדנאות, או עבודה משותפת\n\nהתקשורת היא שקופה: עדכונים יומיים, שיתוף מסך, ופגישות וידאו לפי הצורך.'
        }
      ]
    };

    // ═══════════════════════════════════════════════════════════
    //  ENGINE — Smart matching + conversation + WhatsApp fallback
    // ═══════════════════════════════════════════════════════════

    const $ = (id) => document.getElementById(id);
    let isProcessing = false;

    // ── Init ──
    function init() {
      // Header
      $('headerName').textContent = CONFIG.agentName + ' — ' + CONFIG.agentTitle;
      $('headerStatus').textContent = CONFIG.statusText;
      $('welcomeEmoji').textContent = CONFIG.welcomeEmoji;
      $('welcomeText').textContent = CONFIG.welcomeText;

      // Avatar
      const avatarEl = $('avatarContent');
      if (CONFIG.agentAvatarImage) {
        avatarEl.innerHTML = '<img class="avatar-image" src="' + CONFIG.agentAvatarImage + '" alt="' + CONFIG.agentName + '">';
      } else {
        avatarEl.textContent = CONFIG.agentAvatar;
      }

      // Input
      $('chatInput').placeholder = CONFIG.inputPlaceholder;
      $('chatInput').addEventListener('input', handleInputChange);
      $('chatInput').addEventListener('keydown', handleInputKeydown);
      $('sendBtn').addEventListener('click', handleSend);

      // Suggestion chips
      renderSuggestions();
    }

    // ── Suggestions ──
    function renderSuggestions() {
      const strip = $('suggestionsStrip');
      strip.innerHTML = '';
      CONFIG.presetQuestions.forEach(function(item, i) {
        var chip = document.createElement('button');
        chip.className = 'suggestion-chip';
        chip.dataset.index = i;
        chip.innerHTML = '<span class="chip-icon">' + (item.icon || '❓') + '</span>' + item.q;
        chip.addEventListener('click', function() { handlePresetClick(i); });
        strip.appendChild(chip);
      });
    }

    function disableChip(index) {
      var chips = $('suggestionsStrip').querySelectorAll('.suggestion-chip');
      if (chips[index]) {
        chips[index].disabled = true;
      }
    }

    // ── Time ──
    function getTime() {
      return new Date().toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' });
    }

    // ── Create message row ──
    function createMessage(type, html) {
      var row = document.createElement('div');
      row.className = 'message-row ' + type;

      var avatar = document.createElement('div');
      avatar.className = 'message-avatar' + (type === 'user' ? ' user-avatar' : '');

      if (type === 'bot') {
        if (CONFIG.agentAvatarImage) {
          avatar.innerHTML = '<img src="' + CONFIG.agentAvatarImage + '" alt="' + CONFIG.agentName + '">';
        } else {
          avatar.textContent = CONFIG.agentAvatar;
        }
      } else {
        avatar.textContent = CONFIG.userAvatarText;
      }

      var bubble = document.createElement('div');
      bubble.className = 'message-bubble';
      bubble.innerHTML = '<div>' + html + '</div><div class="message-time">' + getTime() + '</div>';

      row.appendChild(avatar);
      row.appendChild(bubble);
      return row;
    }

    // ── Typing indicator ──
    function showTyping() {
      var row = document.createElement('div');
      row.className = 'typing-indicator';
      row.id = 'typingIndicator';

      var avatar = document.createElement('div');
      avatar.className = 'message-avatar';
      if (CONFIG.agentAvatarImage) {
        avatar.innerHTML = '<img src="' + CONFIG.agentAvatarImage + '" alt="' + CONFIG.agentName + '">';
      } else {
        avatar.textContent = CONFIG.agentAvatar;
      }

      var bubble = document.createElement('div');
      bubble.className = 'typing-bubble';
      bubble.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';

      row.appendChild(avatar);
      row.appendChild(bubble);
      $('messagesArea').appendChild(row);
      scrollToBottom();
    }

    function hideTyping() {
      var el = $('typingIndicator');
      if (el) el.remove();
    }

    function scrollToBottom() {
      var area = $('messagesArea');
      requestAnimationFrame(function() {
        area.scrollTo({ top: area.scrollHeight, behavior: 'smooth' });
      });
    }

    // ── Smart keyword matching ──
    function normalizeHebrew(text) {
      return text
        .replace(/[?!.,;:'"()\-]/g, '')
        .replace(/\s+/g, ' ')
        .trim()
        .toLowerCase();
    }

    function findBestMatch(userText) {
      var normalized = normalizeHebrew(userText);
      if (normalized.length < 2) return null;

      var bestScore = 0;
      var bestEntry = null;

      CONFIG.knowledgeBase.forEach(function(entry) {
        var score = 0;
        var hasDirectMatch = false;

        entry.q.forEach(function(keyword) {
          var kw = normalizeHebrew(keyword);
          if (kw.length < 2) return;

          // Direct substring match — strongest signal
          if (normalized.indexOf(kw) !== -1 || kw.indexOf(normalized) !== -1) {
            score += 10;
            hasDirectMatch = true;
          }
        });

        if (score > bestScore) {
          bestScore = score;
          bestEntry = entry;
        }
      });

      // Only return if we have a direct keyword match (score >= 10)
      // Otherwise return null → triggers WhatsApp fallback
      if (bestScore >= 10 && bestEntry) {
        return bestEntry.a;
      }
      return null;
    }

    // ── Format text (newlines to <br>) ──
    function formatText(text) {
      return text.replace(/\n/g, '<br>');
    }

    // ── Build WhatsApp fallback HTML ──
    function buildFallbackHTML(userQuestion) {
      var encodedQ = encodeURIComponent('שאלה מהאתר: ' + userQuestion);
      var waUrl = 'https://wa.me/' + CONFIG.whatsappNumber + '?text=' + encodedQ;

      var html = formatText(CONFIG.fallbackMessage);
      html += '<br><a class="wa-fallback-btn" href="' + waUrl + '" target="_blank" rel="noopener noreferrer">';
      html += '<svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>';
      html += '💬 שלח לי בוואטסאפ';
      html += '</a>';
      return html;
    }

    // ── Process a question ──
    function processQuestion(text) {
      if (isProcessing) return;
      isProcessing = true;

      var trimmed = text.trim();
      if (!trimmed) { isProcessing = false; return; }

      // Add user message
      var userMsg = createMessage('user', formatText(trimmed));
      $('messagesArea').appendChild(userMsg);
      scrollToBottom();

      // Show typing
      setTimeout(function() {
        showTyping();

        // Find answer
        var answer = findBestMatch(trimmed);
        var delay = CONFIG.typingDelay + Math.random() * 600;

        setTimeout(function() {
          hideTyping();

          var responseHTML;
          if (answer) {
            responseHTML = formatText(answer);
          } else {
            responseHTML = buildFallbackHTML(trimmed);
          }

          var botMsg = createMessage('bot', responseHTML);
          $('messagesArea').appendChild(botMsg);
          scrollToBottom();
          isProcessing = false;
        }, delay);
      }, 300);
    }

    // ── Preset question click ──
    function handlePresetClick(index) {
      if (isProcessing) return;
      var item = CONFIG.presetQuestions[index];
      disableChip(index);
      processQuestion(item.q);
    }

    // ── Input handlers ──
    function handleInputChange() {
      var input = $('chatInput');
      var btn = $('sendBtn');
      btn.disabled = !input.value.trim();

      // Auto-resize textarea
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 100) + 'px';
    }

    function handleInputKeydown(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        handleSend();
      }
    }

    function handleSend() {
      var input = $('chatInput');
      var text = input.value.trim();
      if (!text || isProcessing) return;

      input.value = '';
      input.style.height = 'auto';
      $('sendBtn').disabled = true;

      processQuestion(text);
    }

    // ── Boot ──
    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
